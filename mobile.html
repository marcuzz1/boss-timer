<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>巡王計時器 · 手機版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --night:#000; --night2:#0a0a0f; --panel:#101017; --panel2:#1c1c26; --edge:#2b2b38;
    --gold:#ffce54; --leaf:#5ecb7a; --violet:#b06bff; --ember:#ff6f61; --grape:#b6a6e2; --cream:#fdf3df;
    --tabh:60px;
  }
  html,body{margin:0;height:100%;}
  body{
    background:#000; color:var(--cream); font-family:"Noto Sans TC",sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .pix{font-family:"Silkscreen","Noto Sans TC",monospace;letter-spacing:.5px;}
  img{image-rendering:pixelated;image-rendering:crisp-edges;}
  button,input,select{font-family:inherit;}
  .plate{background:var(--panel);border:2px solid var(--edge);border-radius:12px;}

  /* top bar */
  .mtop{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; background:#000;border-bottom:1px solid var(--edge);
  }
  .mtop .crest{width:32px;height:32px;display:grid;place-items:center;font-size:19px;background:var(--gold);color:#4a2d00;border-radius:8px;flex:0 0 auto;}
  .mtop .ttl{font-weight:900;font-size:16px;line-height:1;}
  .mtop .clock{margin-left:auto;font-size:18px;color:var(--gold);}
  .mtop .sbtn{background:transparent;border:none;color:var(--cream);font-size:20px;padding:4px;}
  .mtop .sbtn.off{opacity:.5;}
  .mtop .conn{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:0 0 auto;}
  .mtop .conn.on{background:var(--leaf);}

  /* hero */
  .mhero{margin:12px 12px 0;padding:12px 14px;display:flex;align-items:center;gap:12px;min-height:76px;}
  .mhero .port{width:58px;height:58px;flex:0 0 auto;display:grid;place-items:center;background:var(--night2);border:2px solid var(--edge);border-radius:10px;overflow:hidden;}
  .mhero .port img{width:52px;height:52px;object-fit:contain;} .mhero .port .emoji{font-size:34px;}
  .mhero .eb{font-size:12px;color:var(--grape);font-weight:700;}
  .mhero .mid{min-width:0;}
  .mhero .nm{font-size:19px;font-weight:900;overflow-wrap:anywhere;}
  .mhero .whr{font-size:12px;color:var(--grape);overflow-wrap:anywhere;}
  .mhero .rt{margin-left:auto;text-align:right;flex:0 0 auto;}
  .mhero .cd{font-size:clamp(20px,6.5vw,30px);line-height:1.1;color:var(--gold);white-space:nowrap;}
  .mhero .stt{font-size:12px;color:var(--grape);margin-top:4px;}
  .mhero.is-overdue{border-color:var(--ember);} .mhero.is-overdue .cd{color:var(--ember);}
  .mhero.is-window{border-color:var(--violet);} .mhero.is-window .cd{color:var(--violet);}
  .mhero .empty{color:var(--grape);font-size:13px;line-height:1.6;}
  /* 窄螢幕:縮小頭像與倒數字級,讓王名有足夠寬度不被壓成一字一行 */
  @media (max-width:360px){
    .mhero{gap:8px;padding:10px 11px;}
    .mhero .port{width:46px;height:46px;}
    .mhero .port img{width:40px;height:40px;} .mhero .port .emoji{font-size:26px;}
    .mhero .nm{font-size:16px;}
    .mhero .cd{font-size:21px;}
    .mhero .stt{font-size:11px;margin-top:2px;}
  }

  /* views */
  main{padding:12px 12px calc(var(--tabh) + env(safe-area-inset-bottom) + 16px);}
  .view{display:none;} .view.active{display:block;}
  .h2{font-size:15px;font-weight:900;margin:2px 2px 10px;display:flex;align-items:baseline;gap:8px;}
  .h2 .tally{font-size:12px;color:var(--grape);font-weight:700;}
  .recFilter{color-scheme:dark;background:var(--night2);color:var(--cream);border:2px solid var(--edge);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:13px;font-weight:700;outline:none;}
  .recFilter:focus{border-color:var(--gold);}

  /* boss picker */
  .picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
  .pick{flex:0 0 auto;width:82px;text-align:center;background:var(--night2);border:2px solid var(--edge);border-radius:10px;padding:8px 6px;}
  .pick.on{border-color:var(--gold);background:#24222e;box-shadow:inset 0 0 0 1px var(--gold);}
  .pick .sp{width:38px;height:38px;object-fit:contain;} .pick .em{font-size:28px;line-height:38px;}
  .pick .nm{font-size:12px;font-weight:700;margin-top:3px;} .pick .rt{font-size:10px;color:var(--grape);margin-top:2px;}

  /* record */
  .track{display:flex;align-items:center;gap:12px;margin:14px 0 10px;padding:10px;}
  .track .port{width:44px;height:44px;background:var(--night2);border:2px solid var(--edge);border-radius:8px;display:grid;place-items:center;overflow:hidden;}
  .track .port img{width:38px;height:38px;object-fit:contain;} .track .port .emoji{font-size:26px;}
  .track .lab{font-size:11px;color:var(--grape);} .track .val{font-weight:900;font-size:15px;}
  .fld{margin-bottom:10px;} .fld label{display:block;font-size:12px;color:var(--grape);margin-bottom:5px;font-weight:700;}
  .fld input,.fld select{width:100%;background:var(--night2);color:var(--cream);border:2px solid var(--edge);border-radius:9px;padding:13px 12px;font-size:15px;outline:none;}
  .fld input:focus,.fld select:focus{border-color:var(--gold);}
  .fld input.need{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,111,97,.35);}
  .fld input.need::placeholder{color:var(--ember);}
  .big-go{width:100%;background:var(--leaf);color:#06210f;border:2px solid var(--edge);border-radius:10px;padding:15px;font-size:16px;font-weight:900;box-shadow:0 3px 0 var(--edge);}
  .big-go:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge);}
  .est{margin-top:10px;color:var(--grape);font-size:12px;} .est b{color:var(--cream);}
  .fld input[type=time],.fld select{color-scheme:dark;}
  .ovBox{margin-top:14px;background:var(--night2);border:2px solid var(--edge);border-radius:12px;padding:12px;}
  .ovTitle{font-size:14px;font-weight:900;color:var(--gold);margin-bottom:10px;}
  .ovTitle span{color:var(--grape);font-weight:500;font-size:12px;margin-left:8px;}
  .ovBox input,.ovBox select{background:var(--panel);}

  /* grid */
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin:14px 2px 8px;font-size:12px;color:var(--grape);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .chip{width:11px;height:11px;border:1px solid var(--edge);display:inline-block;}
  .chip.overdue{background:var(--ember);} .chip.window{background:var(--violet);} .chip.soon{background:var(--gold);} .chip.counting{background:var(--leaf);} .chip.idle{background:#3a3363;}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .cell{min-height:56px;min-width:0;padding:4px 3px;overflow:hidden;background:var(--night2);border:2px solid var(--edge);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;}
  .cell .ch{font-size:14px;color:var(--grape);} .cell .cd{font-size:12px;margin-top:2px;color:var(--cream);text-align:center;line-height:1.25;max-width:100%;overflow-wrap:anywhere;}
  .cell.selected{outline:3px solid var(--gold);outline-offset:1px;}
  .cell.counting{border-color:var(--leaf);} .cell.counting .cd{color:var(--leaf);}
  .cell.soon{border-color:var(--gold);} .cell.soon .cd{color:var(--gold);}
  .cell.window{border-color:var(--violet);} .cell.window .cd{color:var(--violet);}
  .cell.overdue{border-color:var(--ember);background:#33172a;} .cell.overdue .cd{color:var(--ember);}
  .hint{color:var(--grape);font-size:12px;margin-top:10px;text-align:center;}

  /* patrol */
  .pchips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;}
  .pchip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--night2);border:2px solid var(--edge);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--cream);}
  .pchip.on{border-color:var(--gold);color:var(--gold);background:#24222e;}
  .pchip .u{background:var(--ember);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;min-width:16px;text-align:center;}
  .pgroup{background:var(--panel2);border:2px solid var(--edge);border-radius:12px;padding:10px;margin-bottom:12px;}
  .pghead{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;border-bottom:1px dashed #3a3363;margin-bottom:8px;}
  .pghead .sp{width:26px;height:26px;object-fit:contain;} .pghead .em{font-size:20px;line-height:26px;}
  .pghead .nm{font-weight:900;font-size:14px;} .pghead .tl{margin-left:auto;font-size:11px;color:var(--grape);font-weight:700;}
  .prow{display:grid;grid-template-columns:1fr auto;grid-template-areas:"info cd" "kill del";gap:12px;align-items:center;background:var(--night2);border:2px solid var(--edge);border-radius:12px;padding:16px;}
  .prow + .prow{margin-top:12px;}
  .prow .info{min-width:0;grid-area:info;}
  .prow .ch{font-size:22px;font-weight:800;font-family:"PMingLiU","新細明體",serif;} .prow .who{font-size:13px;color:var(--grape);margin-top:3px;overflow-wrap:anywhere;word-break:break-word;} .prow .cd{grid-area:cd;font-size:clamp(20px,6.5vw,30px);text-align:right;white-space:nowrap;line-height:1.1;}
  .prow.soon .cd{color:var(--gold);} .prow.window .cd{color:var(--violet);} .prow.overdue .cd{color:var(--ember);}
  .prow .kill{grid-area:kill;width:100%;background:var(--leaf);color:#06210f;border:2px solid var(--edge);border-radius:10px;padding:16px 18px;font-size:18px;font-weight:900;box-shadow:0 3px 0 var(--edge);white-space:nowrap;}
  .prow .kill:active{transform:translateY(2px);box-shadow:0 0 0 var(--edge);}
  .prow .pdel{grid-area:del;background:#3a1c28;color:var(--ember);border:2px solid var(--edge);border-radius:10px;padding:16px 14px;font-size:16px;font-weight:900;box-shadow:0 2px 0 var(--edge);white-space:nowrap;}
  .prow .pdel:active{transform:translateY(2px);box-shadow:0 0 0 var(--edge);}

  /* records list */
  .rec{display:flex;align-items:center;gap:10px;background:var(--night2);border:2px solid var(--edge);border-radius:10px;padding:10px;margin-bottom:8px;}
  .rec > div{min-width:0;}
  .rec .nm{font-weight:700;font-size:14px;overflow-wrap:anywhere;} .rec .sub{font-size:12px;color:var(--grape);margin-top:2px;overflow-wrap:anywhere;}
  .rec .rt{margin-left:auto;text-align:right;flex:0 0 auto;} .rec .cd{font-size:15px;white-space:nowrap;} .rec .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid var(--edge);display:inline-block;margin-top:3px;}
  .tag.counting{background:rgba(94,203,122,.2);color:var(--leaf);} .tag.soon{background:rgba(255,206,84,.2);color:var(--gold);}
  .tag.window{background:rgba(176,107,255,.2);color:var(--violet);} .tag.overdue{background:rgba(255,111,97,.2);color:var(--ember);}
  .rec .del{flex:0 0 auto;background:#3a1c28;color:var(--ember);border:2px solid var(--edge);border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700;white-space:nowrap;}

  /* 名稱由 Discord 決定,不能改 */
  .fld input.locked,input.locked{color:var(--gold);background:#17141f;cursor:default;}
  .fld input.locked:focus,input.locked:focus{border-color:var(--edge);outline:none;}

  /* 紀錄頁籤（目前紀錄 / 歷史紀錄） */
  .rtabs{display:flex;gap:6px;margin:0 2px 10px;}
  .rtab{flex:1;background:var(--night2);color:var(--grape);border:2px solid var(--edge);border-radius:9px;padding:9px 6px;font-size:13px;font-weight:700;}
  .rtab.on{background:var(--panel2);color:var(--gold);border-color:var(--gold);}
  /* 歷史紀錄卡片 */
  .hrow{background:var(--night2);border:2px solid var(--edge);border-radius:10px;padding:10px;margin-bottom:8px;}
  .hrow .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .hact{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid var(--edge);white-space:nowrap;}
  .hact.kill,.hact.add{background:rgba(94,203,122,.2);color:var(--leaf);}
  .hact.edit{background:rgba(255,206,84,.2);color:var(--gold);}
  .hact.del{background:rgba(255,111,97,.2);color:var(--ember);}
  .hact.restore{background:rgba(176,107,255,.2);color:var(--violet);}
  .hrow .nm{font-weight:700;font-size:14px;min-width:0;overflow-wrap:anywhere;}
  .hrow .when{margin-left:auto;font-size:11px;color:var(--grape);font-weight:700;white-space:nowrap;}
  .hrow .sub{font-size:12px;color:var(--grape);margin-top:5px;overflow-wrap:anywhere;}
  .hrow .prevt{text-decoration:line-through;opacity:.75;}
  .hrow .undo{width:100%;margin-top:9px;background:#1d3324;color:var(--leaf);border:2px solid var(--edge);border-radius:9px;padding:11px;font-size:14px;font-weight:800;}
  .hrow .undo:active{transform:translateY(2px);}

  /* board */
  .msgs{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;padding-bottom:76px;}
  .msg{background:var(--night2);border:2px solid var(--edge);border-radius:10px;padding:9px 11px;}
  .msg .who{font-size:12px;color:var(--gold);font-weight:700;} .msg .who time{color:var(--grape);font-weight:500;margin-left:6px;}
  .msg .say{font-size:14px;line-height:1.45;word-break:break-word;margin-top:3px;}
  .bform{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:25;background:#000;border-top:1px solid var(--edge);padding:8px 12px;display:grid;grid-template-columns:1fr auto;gap:7px;}
  .bform input{background:var(--night2);color:var(--cream);border:2px solid var(--edge);border-radius:9px;padding:12px 11px;font-size:15px;outline:none;min-width:0;}
  .bform input:focus{border-color:var(--gold);}
  .bform button{background:var(--leaf);color:#06210f;border:2px solid var(--edge);border-radius:9px;padding:0 16px;font-size:15px;font-weight:900;}

  .empty{color:var(--grape);text-align:center;padding:20px;font-size:13px;line-height:1.7;}

  /* bottom tabs */
  .mtabs{
    position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabh) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    display:grid;grid-template-columns:repeat(4,1fr);background:#0a0a0f;border-top:1px solid var(--edge);
  }
  .tab{background:transparent;border:none;color:var(--grape);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
  .tab .ic{font-size:20px;line-height:1;}
  .tab.on{color:var(--gold);}
  .tab .badge{position:absolute;transform:translate(14px,-14px);background:var(--ember);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;min-width:16px;text-align:center;}

  @media (prefers-reduced-motion: no-preference){
    .cell.overdue{animation:nudge 1.6s ease-in-out infinite;}
    @keyframes nudge{0%,92%,100%{transform:translateY(0);}96%{transform:translateY(-2px);}}
  }
</style>
</head>
<body>
<div id="authGate" style="position:fixed;inset:0;z-index:100000;background:#000;color:#fdf3df;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:'Noto Sans TC',sans-serif;"><div style="max-width:420px;"><div style="font-size:16px;">載入中…</div></div></div>

<div class="mtop">
  <div class="crest">🍄</div>
  <div class="ttl">巡王計時器</div>
  <button class="sbtn" id="soundBtn" type="button" aria-label="音效開關">🔊</button>
  <a class="sbtn" href="index.html?pc=1" aria-label="電腦版" style="text-decoration:none;">🖥</a>
  <div class="conn" id="conn" aria-label="連線狀態"></div>
</div>

<section class="plate mhero" id="hero" aria-live="polite">
  <div class="empty">現在沒有王在倒數。到「頻道」記一筆,這裡就會告訴你下一隻。</div>
</section>

<main>
  <!-- 巡查 -->
  <section class="view active" data-view="patrol">
    <div class="h2">優先巡查<span class="tally" id="patrolCount">0 個</span></div>
    <div class="pchips" id="pchips"></div>
    <div id="patrol"><div class="empty">還沒有快出現的王。<br>倒數剩 5 分鐘內會排到這裡。</div></div>
  </section>

  <!-- 頻道 / 記錄 -->
  <section class="view" data-view="ch">
    <div class="h2">選擇 BOSS</div>
    <div class="picker" id="picker"></div>

    <div class="plate track">
      <div class="port" id="trackPort"></div>
      <div><div class="lab">目前追蹤</div><div class="val" id="trackName" style="color:var(--gold)">—</div>
      <div class="lab" id="trackMap" style="margin-top:3px;">—</div></div>
      <div style="margin-left:auto;text-align:right;"><div class="lab">重生</div><div class="val" id="trackRt">—</div></div>
    </div>

    <div class="fld"><label for="chInput">頻道 CH（1~60）</label><input id="chInput" type="number" inputmode="numeric" min="1" max="60" placeholder="輸入頻道"></div>
    <div class="fld"><label for="killerInput">你的 ID（取自 Discord,不可修改）</label><input id="killerInput" class="locked" type="text" maxlength="16" placeholder="Discord 暱稱" readonly title="名稱固定取用你在指定 Discord 伺服器的暱稱,無法修改"></div>
    <button class="big-go" id="recordBtn" type="button">⚔ 記錄擊殺</button>
    <button class="big-go" id="delChBtn" type="button" style="background:#3a1c28;color:var(--ember);margin-top:10px;">🗑 刪除此頻道紀錄</button>
    <button class="big-go" id="delBossBtn" type="button" style="background:#3a1c28;color:var(--ember);margin-top:10px;">🧹 清除此王全部頻道紀錄</button>
    <div class="ovBox">
      <div class="ovTitle">🕓 校正時間<span>蓋掉這個頻道原本的紀錄</span></div>
      <div class="fld"><label for="ovMode">方式</label><select id="ovMode"><option value="min">倒數幾分鐘</option><option value="time">指定擊殺時間</option></select></div>
      <div class="fld"><label id="ovLabel" for="ovMin">倒數分鐘</label><input id="ovMin" type="number" inputmode="numeric" min="0" max="1440" placeholder="例如 5"><input id="ovTime" type="time" style="display:none;"></div>
      <button class="big-go" id="ovBtn" type="button" style="background:var(--gold);color:#4a2d00;">套用自訂時間</button>
    </div>
    <div class="est" id="estimate">現在記錄的話,預估重生：<b>—</b></div>

    <div class="legend">
      <span><i class="chip overdue"></i>已重生</span>
      <span><i class="chip window"></i>重生區間</span>
      <span><i class="chip soon"></i>快出現</span>
      <span><i class="chip counting"></i>倒數中</span>
      <span><i class="chip idle"></i>沒紀錄</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="hint">點頻道帶入上面的欄位,再按「記錄擊殺」。</div>
  </section>

  <!-- 紀錄 -->
  <section class="view" data-view="log">
    <div class="h2">紀錄<span class="tally" id="recordCount">0 筆</span>
      <select id="recFilter" class="recFilter"></select>
      <button id="clearAllBtn" style="margin-left:auto;background:#3a1c28;color:var(--ember);border:2px solid var(--edge);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;">全部清除</button>
    </div>
    <div class="rtabs">
      <button class="rtab on" data-rtab="now" type="button">目前紀錄</button>
      <button class="rtab" data-rtab="hist" type="button">歷史紀錄</button>
    </div>
    <div id="recordList"><div class="empty">還沒有紀錄。到「頻道」記一筆吧。</div></div>
    <div id="historyList" style="display:none;"><div class="empty">還沒有歷史紀錄。<br>之後新增、校正、刪除都會留在這裡（最新 50 筆）。</div></div>
  </section>

  <!-- 留言 -->

const isFloating = b => b.respawnMin !== b.respawnMax;

const windowOf = it => ({ earliest: it.killTime + bossByKey[it.boss].respawnMin*MIN, latest: it.killTime + bossByKey[it.boss].respawnMax*MIN });
const fmtClock = ts => { const d=new Date(ts),p=n=>String(n).padStart(2,"0"); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
const fmtHM = ts => { const d=new Date(ts),p=n=>String(n).padStart(2,"0"); return `${p(d.getHours())}:${p(d.getMinutes())}`; };
function fmtCountdown(ms){ if(ms<=0) return "00:00"; const s=Math.ceil(ms/1000),p=n=>String(n).padStart(2,"0"); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),c=s%60; return h>0?`${p(h)}:${p(m)}:${p(c)}`:`${p(m)}:${p(c)}`; }
function stateOf(it,now){ if(!it||!bossByKey[it.boss]) return "idle"; const {earliest,latest}=windowOf(it); if(now>=latest) return "overdue"; if(now>=earliest) return "window"; if(earliest-now<=SOON_MS) return "soon"; return "counting"; }

const escapeHtml = t => String(t).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");

/* sound */
let soundOn = localStorage.getItem("bt_sound") !== "off";
let audioCtx = null;
const customAudio = new Audio("usagi.mp3"); let customOk=false;
customAudio.addEventListener("canplaythrough",()=>{customOk=true;}); customAudio.addEventListener("error",()=>{customOk=false;});
const readyAudio=new Audio("three_gun.mp3"); let readyOk=false;
readyAudio.addEventListener("canplaythrough",()=>{readyOk=true;}); readyAudio.addEventListener("error",()=>{readyOk=false;});
function ensureAudio(){ if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext; if(AC) audioCtx=new AC();} if(audioCtx&&audioCtx.state==="suspended") audioCtx.resume(); }
function synthAlarm(){ ensureAudio(); if(!audioCtx) return; const ctx=audioCtx,t0=ctx.currentTime; [[880,0,.16],[1245,.16,.16],[1046,.34,.16],[1568,.52,.45]].forEach(([f,st,du])=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.type="triangle"; o.frequency.setValueAtTime(f,t0+st); o.frequency.linearRampToValueAtTime(f*1.05,t0+st+du); o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0,t0+st); g.gain.linearRampToValueAtTime(.25,t0+st+.02); g.gain.exponentialRampToValueAtTime(.001,t0+st+du); o.start(t0+st); o.stop(t0+st+du+.03); }); }
function playAlarm(){ if(!soundOn) return; if(customOk){ customAudio.currentTime=0; const p=customAudio.play(); if(p) p.catch(()=>synthAlarm()); setTimeout(()=>{try{customAudio.pause();}catch(e){}},1000);} else synthAlarm(); }
const knownKill=new Set(), alerted=new Set();
function checkAlarms(now){ for(const [id,it] of Object.entries(kills)){ if(!it||!bossByKey[it.boss]) continue; const tag=`${id}:${it.killTime}`, past=now>=windowOf(it).earliest; if(!knownKill.has(tag)){knownKill.add(tag); if(past) alerted.add(tag);} if(past&&!alerted.has(tag)){alerted.add(tag); if(it.boss===currentBoss) playAlarm();} } }
function synthReady(){
  ensureAudio(); if(!audioCtx) return;
  const ctx=audioCtx,t0=ctx.currentTime;
  [[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.18],[880,.58,.1],[1047,.70,.1],[1319,.82,.32]].forEach(([f,st,du])=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="square"; o.frequency.setValueAtTime(f,t0+st);
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0,t0+st); g.gain.linearRampToValueAtTime(.16,t0+st+.02); g.gain.exponentialRampToValueAtTime(.001,t0+st+du);
    o.start(t0+st); o.stop(t0+st+du+.03);
  });
}
function playReady(){
  if(!soundOn) return;
  if(readyOk){ readyAudio.currentTime=0; const p=readyAudio.play(); if(p) p.catch(()=>synthReady()); }
  else synthReady();
}
let roundWasEmpty=null, roundRemindAt=null;
function checkRoundReminder(now){
  const items=sortedRows(now).filter(it=>it.boss===currentBoss && (it.st==="overdue"||it.st==="window"||it.st==="soon"));
  const empty=items.length===0;
  if(roundWasEmpty===null){ roundWasEmpty=empty; }
  else if(roundWasEmpty && !empty){
    const soonest=Math.min(...items.map(it=>it.earliest));
    const t=soonest-3*MIN;
    roundRemindAt=(t>now+1000)?t:null;
  }
  roundWasEmpty=empty;
  if(roundRemindAt!==null && now>=roundRemindAt){ roundRemindAt=null; playReady(); }
}

/* writes */
async function recordKill(bossKey,ch){
  ch=Number(ch);
  if(!ch||ch<1||ch>CHANNELS){ alert("請輸入 1~60 的頻道"); return; }

  catch(err){ console.error(err); alert("記錄沒存上去。檢查 Firebase 規則。"); return; }
  logHistory({action:"kill",boss:bossKey,bossName:b.name,ch,killer,killTime,prev});
}

  const el=$("killerInput"); if(el) el.classList.remove("need");
  return lockedNick;
}
async function deleteKill(id){

}
async function clearAll(){

  const snap=Object.values(kills).filter(it=>it&&bossByKey[it.boss]);
  try{ await remove(killsRef); }catch(err){ console.error(err); alert("清不掉。"); return; }

}
async function clearBoss(bossKey){
  const b=bossByKey[bossKey];
  const ids=Object.keys(kills).filter(id=>kills[id]&&kills[id].boss===bossKey);
  if(!ids.length){ alert(`${b.name} 目前沒有任何紀錄`); return; }
  if(!confirm(`確定清除「${b.name}」全部 ${ids.length} 個頻道的紀錄嗎？`)) return;
  const snap=ids.map(id=>kills[id]).filter(Boolean);
  try{ await Promise.all(ids.map(id=>remove(ref(db,`${KILLS_PATH}/${id}`)))); }
  catch(err){ console.error(err); alert("清除失敗,請確認 Firebase 規則。"); return; }
  for(const it of snap) await logHistory({action:"del",boss:it.boss,bossName:b.name,ch:it.ch,killer:it.killer,killTime:it.killTime});

async function applyOverride(bossKey,chRaw){
  const ch=Number(chRaw);
  if(!ch||ch<1||ch>CHANNELS){ alert("請先在上面「頻道 CH」輸入頻道 (1~60)"); return; }
  const b=bossByKey[bossKey], mode=$("ovMode").value;
  let killTime;
  if(mode==="min"){
    const mins=Number($("ovMin").value);
    if($("ovMin").value===""||isNaN(mins)||mins<0){ alert("請輸入倒數分鐘數"); return; }
    killTime=serverNow()+mins*MIN-b.respawnMin*MIN; // 讓最早重生 = 現在 + 倒數分鐘
  } else {
    const t=$("ovTime").value;
    if(!t){ alert("請選擇擊殺時間"); return; }
    const [hh,mm]=t.split(":").map(Number);
    const d=new Date(serverNow()); d.setHours(hh,mm,0,0); killTime=d.getTime();
    if(killTime>serverNow()) killTime-=24*60*60*1000;
  }
  const existing=kills[killId(bossKey,ch)];
  const killer=((existing&&existing.killer)||lockedNick||"匿名").slice(0,16);
  try{ await set(ref(db,`${KILLS_PATH}/${killId(bossKey,ch)}`),{boss:bossKey,bossName:b.name,ch,killer,killTime}); }
  catch(err){ console.error(err); alert("套用失敗,請確認 Firebase 規則。"); return; }
  logHistory({action:"edit",boss:bossKey,bossName:b.name,ch,killer,killTime,prev:existing});
}

/* 歷史紀錄:每次變動留一筆,只保留最新 HISTORY_MAX 筆,最新的在最上面 */
const HIST_LABEL={kill:"擊殺",add:"擊殺",edit:"校正",del:"刪除",restore:"復原"};
const currentNick=()=>lockedNick||"匿名";
async function logHistory({action,boss,bossName,ch,killer,killTime,prev}){
  const entry={
    action, boss, bossName: bossName||(bossByKey[boss]&&bossByKey[boss].name)||boss,
    ch:Number(ch), killer:(killer||"匿名").slice(0,16), killTime:killTime||0,
    by:currentNick(), at:serverNow(),
  };
  if(prev&&prev.killTime){ entry.prevKiller=(prev.killer||"匿名").slice(0,16); entry.prevKillTime=prev.killTime; }
  try{ const r=await push(historyRef,entry); await trimHistory(r&&r.key); }
  catch(err){ console.error("寫入歷史紀錄失敗:",err); }
}
async function trimHistory(newKey){
  const keys=[...new Set([...Object.keys(histLog),...(newKey?[newKey]:[])])].sort();
  if(keys.length<=HISTORY_MAX) return;
  const extra=keys.slice(0,keys.length-HISTORY_MAX);
  try{ await Promise.all(extra.map(k=>remove(ref(db,`${HISTORY_PATH}/${k}`)))); }
  catch(err){ console.error("清理舊歷史紀錄失敗:",err); }
}
const historyRows=()=>Object.entries(histLog)
  .filter(([,h])=>h&&h.boss&&bossByKey[h.boss])
  .map(([id,h])=>({id,...h}))
  .sort((a,b)=>(b.at||0)-(a.at||0))
  .slice(0,HISTORY_MAX);
const restoreTarget=h=>h.prevKillTime
  ? {killer:h.prevKiller||h.killer,killTime:h.prevKillTime}
  : {killer:h.killer,killTime:h.killTime};
async function restoreFromHistory(hid){
  const h=histLog[hid];
  if(!h||!bossByKey[h.boss]){ alert("這筆歷史紀錄的資料不完整,沒辦法復原。"); return; }
  const tgt=restoreTarget(h);
  if(!tgt.killTime){ alert("這筆歷史紀錄沒有擊殺時間,沒辦法復原。"); return; }
  const b=bossByKey[h.boss], exist=kills[killId(h.boss,h.ch)];
  const msg=exist
    ? `${b.name} CH${h.ch} 目前已有紀錄（${fmtHM(exist.killTime)} 擊殺）。\n要用歷史紀錄的 ${fmtHM(tgt.killTime)} 蓋掉嗎？`
    : `要把 ${b.name} CH${h.ch}（${fmtHM(tgt.killTime)} 擊殺）復原嗎？`;
  if(!confirm(msg)) return;
  try{ await set(ref(db,`${KILLS_PATH}/${killId(h.boss,h.ch)}`),{boss:h.boss,bossName:b.name,ch:Number(h.ch),killer:tgt.killer||"匿名",killTime:tgt.killTime}); }
  catch(err){ console.error(err); alert("復原失敗,請確認 Firebase 規則。"); return; }
  logHistory({action:"restore",boss:h.boss,bossName:b.name,ch:h.ch,killer:tgt.killer,killTime:tgt.killTime,prev:exist});
}

/* render */
const sortedRows = now => Object.entries(kills).filter(([,it])=>it&&bossByKey[it.boss]).map(([id,it])=>({id,...it,st:stateOf(it,now),earliest:windowOf(it).earliest})).sort((a,b)=>a.earliest-b.earliest);

function renderHero(now){
  const hero=$("hero"); const b0=bossByKey[currentBoss]; const next=sortedRows(now).find(it=>it.boss===currentBoss);
  const sig = next ? `${next.boss}|${next.ch}|${next.st}|${next.killTime}` : "none";
  if(sig===lastHeroSig){ if(next){ const cd=hero.querySelector(".cd"); if(cd) cd.textContent=remainText(next,now); } return; }
  lastHeroSig=sig;
  hero.classList.remove("is-overdue","is-window");
  if(!next){ hero.innerHTML=`<div class="empty">「${escapeHtml(b0.name)}」目前沒有紀錄。到「頻道」記一筆就會顯示下一隻。</div>`; return; }
  const b=bossByKey[next.boss];
  if(next.st==="overdue") hero.classList.add("is-overdue"); else if(next.st==="window") hero.classList.add("is-window");
  const line = next.st==="overdue" ? "已重生,快去 CH"+next.ch : next.st==="window" ? "重生區間,盯 CH"+next.ch : next.st==="soon" ? "快出現了" : "倒數中";
  hero.innerHTML=`
    <div class="port">${spriteTag(b,"","emoji",34)}</div>
    <div class="mid"><div class="eb">下一隻出現</div><div class="nm">${escapeHtml(b.name)}</div><div class="whr">CH${next.ch} ｜ ${escapeHtml(b.map)}</div></div>
    <div class="rt"><div class="cd pix">${remainText(next,now)}</div><div class="stt">${line}</div></div>`;
}
function renderGrid(){
  const now=serverNow();
  for(let i=1;i<=CHANNELS;i++){
    const cell=$(`cell-${i}`), cd=$(`cd-${i}`), item=kills[killId(currentBoss,i)], st=stateOf(item,now);
    cell.classList.remove("counting","soon","window","overdue","selected");
    if(st!=="idle") cell.classList.add(st);
    if(selectedCh===i) cell.classList.add("selected");
    cd.textContent = st==="idle" ? "" : remainText(item,now);
  }
}
function buildPatrolChips(){
  const chips=$("pchips");
  chips.innerHTML=BOSSES.map(b=>`<button class="pchip" id="pchip-${b.key}" data-pb="${b.key}">${b.emoji} ${escapeHtml(b.name)}<span class="u" id="chipu-${b.key}" style="display:none"></span></button>`).join("");
  chips.querySelectorAll("[data-pb]").forEach(btn=>btn.addEventListener("click",()=>setCurrentBoss(btn.dataset.pb)));
}
function updateChips(now){
  BOSSES.forEach(b=>{
    const chip=$(`pchip-${b.key}`); if(!chip) return;
    chip.classList.toggle("on",b.key===currentBoss);
    let urgent=0; for(let i=1;i<=CHANNELS;i++){ const it=kills[killId(b.key,i)]; if(it){ const st=stateOf(it,now); if(st==="overdue"||st==="window"||st==="soon") urgent++; } }
    const u=$(`chipu-${b.key}`); if(u){ u.textContent=urgent||""; u.style.display=urgent?"":"none"; }
  });
}
function renderPatrol(now){
  updateChips(now);
  const b0=bossByKey[currentBoss];
  const items=sortedRows(now).filter(it=>it.boss===currentBoss && ["overdue","window","soon"].includes(it.st));
  $("patrolCount").textContent=`${b0.name}・${items.length} 個`;
  const box=$("patrol");
  const sig=currentBoss+"|"+items.map(it=>`${it.ch}:${it.st}:${it.killTime}`).join(",");
  if(sig===lastPatrolSig){ items.forEach(it=>{ const c=box.querySelector(`[data-cd="${it.boss}_${it.ch}"]`); if(c) c.textContent=remainText(it,now); }); return; }
  lastPatrolSig=sig;
  if(!items.length){ box.innerHTML=`<div class="empty">「${escapeHtml(b0.name)}」目前沒有快出現的頻道。<br>點上面其他王切換。</div>`; return; }
  const rows=items.map(it=>`<div class="prow ${it.st}">
      <div class="info"><div class="ch pix">CH${it.ch}</div><div class="who">${escapeHtml(it.killer||"匿名")} 擊殺</div></div>
      <div class="cd pix" data-cd="${it.boss}_${it.ch}">${remainText(it,now)}</div>
      <button class="kill" data-boss="${it.boss}" data-ch="${it.ch}">⚔ 擊殺</button>
      <button class="pdel" data-boss="${it.boss}" data-ch="${it.ch}" title="刪除此頻道紀錄">🗑</button>
    </div>`).join("");
  box.innerHTML=`<div class="pgroup"><div class="pghead">${spriteTag(b0,"sp","em",20)}<span class="nm">${escapeHtml(b0.name)}</span><span class="tl">${items.length} 個頻道</span></div>${rows}</div>`;
  box.querySelectorAll(".kill").forEach(btn=>btn.addEventListener("click",()=>recordKill(btn.dataset.boss,Number(btn.dataset.ch))));
  box.querySelectorAll(".pdel").forEach(btn=>btn.addEventListener("click",()=>deleteKill(killId(btn.dataset.boss,Number(btn.dataset.ch)))));
}
function buildRecFilter(){
  const sel=$("recFilter");
  sel.innerHTML='<option value="all">全部紀錄</option>'+BOSSES.map(b=>`<option value="${b.key}">${b.name}</option>`).join("");
  sel.value=recFilter;
  sel.addEventListener("change",()=>{ recFilter=sel.value; renderRecords(serverNow()); renderHistory(); });
}
function renderRecords(now){
  let rows=sortedRows(now);
  if(recFilter!=="all") rows=rows.filter(r=>r.boss===recFilter);
  if(recTab==="now") $("recordCount").textContent=`${rows.length} 筆`;
  const box=$("recordList");
  if(!rows.length){ box.innerHTML='<div class="empty">這個篩選目前沒有紀錄。</div>'; return; }
  box.innerHTML=rows.map(r=>{
    const b=bossByKey[r.boss];
    return `<div class="rec">
      ${spriteTag(b,"sp","em",22).replace('class="sp"','class="sp" style="width:34px;height:34px;object-fit:contain;"')}
      <div><div class="nm">${escapeHtml(b.name)} · CH${r.ch}</div><div class="sub">${escapeHtml(r.killer||"匿名")} ｜ ${fmtHM(r.killTime)} 擊殺</div><span class="tag ${r.st}">${STATE_LABEL[r.st]}</span></div>
      <div class="rt"><div class="cd pix">${remainText(r,now)}</div></div>
      <button class="del" data-del="${r.id}">刪</button>
    </div>`;
  }).join("");
  box.querySelectorAll(".del").forEach(btn=>btn.addEventListener("click",()=>deleteKill(btn.dataset.del)));
}
function renderHistory(){
  let rows=historyRows();
  if(recFilter!=="all") rows=rows.filter(h=>h.boss===recFilter);
  if(recTab==="hist") $("recordCount").textContent=`${rows.length} / ${HISTORY_MAX} 筆`;
  const box=$("historyList"); if(!box) return;
  if(!rows.length){ box.innerHTML='<div class="empty">這個篩選沒有歷史紀錄。<br>之後新增、校正、刪除都會留在這裡（最新 50 筆）。</div>'; return; }
  box.innerHTML=rows.map(h=>{
    const act=HIST_LABEL[h.action]||h.action;
    const timeText=h.prevKillTime
      ? `<span class="prevt">${fmtHM(h.prevKillTime)}</span> → ${fmtHM(h.killTime)}`
      : fmtHM(h.killTime);
    return `<div class="hrow">
      <div class="top"><span class="hact ${h.action}">${act}</span><span class="nm">${escapeHtml(h.bossName||"")} · CH${h.ch}</span><span class="when">${fmtHM(h.at||0)}</span></div>
      <div class="sub">${escapeHtml(h.killer||"匿名")} ｜ 擊殺時間 ${timeText}</div>
      <div class="sub">操作者 ${escapeHtml(h.by||"匿名")}</div>
      <button class="undo" data-undo="${h.id}">↩ 復原這筆</button>
    </div>`;
  }).join("");
  box.querySelectorAll("[data-undo]").forEach(btn=>btn.addEventListener("click",()=>restoreFromHistory(btn.dataset.undo)));
}
function setRecTab(tab){
  recTab=tab==="hist"?"hist":"now";
  document.querySelectorAll(".rtab").forEach(b=>b.classList.toggle("on",b.dataset.rtab===recTab));
  $("recordList").style.display=recTab==="now"?"":"none";
  $("historyList").style.display=recTab==="hist"?"":"none";
  const clr=$("clearAllBtn"); if(clr) clr.style.display=recTab==="now"?"":"none";
  renderRecords(serverNow()); renderHistory();
}
function renderBoard(list){
  const box=$("boardMsgs");
  const tally=$("boardTally");
  if(tally) tally.textContent=`${list.length} 則`;
  if(!list.length){ box.innerHTML='<div class="empty">還沒有留言。當第一個留言的人吧！</div>'; return; }
  box.innerHTML=list.map(m=>`<div class="msg"><div class="who">${escapeHtml(m.name||"匿名")}<time>${fmtHM(m.time||serverNow())}</time></div><div class="say">${escapeHtml(m.text||"")}</div></div>`).join("");
  box.scrollTop=box.scrollHeight;
}

function tick(){
  const now=serverNow();
  updateEstimate(); checkAlarms(now); checkRoundReminder(now);
  renderHero(now); renderGrid(); renderPatrol(now); renderRecords(now);
}

onValue(serverOffsetRef,s=>{ serverTimeOffset=s.val()||0; });
onValue(connectedRef,s=>{ connected=s.val()===true; $("conn").classList.toggle("on",connected); });
// 需要登入後才有讀取權限的資料監聽器,登入成功後才啟動,並避免重複訂閱
let _dataListenersStarted=false;
function startDataListeners(){
  if(_dataListenersStarted) return;
  _dataListenersStarted=true;
  onValue(killsRef,s=>{ kills=s.val()||{}; const now=serverNow(); renderHero(now); renderGrid(); renderPatrol(now); renderRecords(now); });
  // 強制重新驗證開關
  onValue(ref(db,"bossTimer/config"),s=>{ handleReloadFlag((s.val()||{}).reload); },
    err=>console.warn("config read failed:",err));
  onValue(historyRef,s=>{ histLog=s.val()||{}; renderHistory(); },
    err=>{ console.error("history read failed:",err); const b=$("historyList"); if(b) b.innerHTML='<div class="empty" style="color:var(--ember)">歷史紀錄讀取失敗,請確認 Firebase 規則已開放 bossTimer/history。</div>'; });
  onValue(boardRef,s=>{
    const obj=s.val()||{};
    const list=Object.entries(obj)
      .map(([id,m])=>({id,name:m&&m.name,text:m&&m.text,time:(m&&m.time)||0}))
      .sort((a,b)=>a.time-b.time)
      .slice(-100);
    renderBoard(list);
  }, err=>{ console.error("board read failed:",err); const t=$("boardTally"); if(t) t.innerHTML='<span style="color:var(--ember)">讀取失敗</span>'; });
}

/* events */
$("recordBtn").addEventListener("click",()=>recordKill(currentBoss,$("chInput").value));
$("delChBtn").addEventListener("click",()=>{
  const ch=Number($("chInput").value);
  if(!ch||ch<1||ch>CHANNELS){ alert("請先在上面「頻道 CH」輸入要刪除的頻道 (1~60)"); return; }
  const b=bossByKey[currentBoss]; const id=killId(currentBoss,ch);
  if(!kills[id]){ alert(`${b.name} CH${ch} 目前沒有紀錄`); return; }
  if(!confirm(`確定刪除「${b.name} CH${ch}」的計時紀錄嗎？`)) return;
  deleteKill(id);
});
$("delBossBtn").addEventListener("click",()=>clearBoss(currentBoss));
function syncOvMode(){
  const mode=$("ovMode").value;
  $("ovMin").style.display=mode==="min"?"":"none";
  $("ovTime").style.display=mode==="time"?"":"none";
  $("ovLabel").textContent=mode==="min"?"倒數分鐘":"時間";
}
$("ovMode").addEventListener("change",syncOvMode); syncOvMode();
$("ovBtn").addEventListener("click",()=>{ if(!requireNick()) return; applyOverride(currentBoss,$("chInput").value); });
$("chInput").addEventListener("keydown",e=>{ if(e.key==="Enter") recordKill(currentBoss,$("chInput").value); });
$("clearAllBtn").addEventListener("click",clearAll);
document.querySelectorAll(".rtab").forEach(btn=>btn.addEventListener("click",()=>setRecTab(btn.dataset.rtab)));
$("boardForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const input=$("boardInput"); const text=input.value.trim(); if(!text) return;
  const name=requireNick(); if(!name) return;
  if(!connected){ alert("尚未連線,留言送不出去。請重新整理或換個網路。"); return; }
  input.value="";
  try{ await push(boardRef,{name,text:text.slice(0,120),time:serverNow()}); }
  catch(err){ console.error("board push failed:",err); input.value=text; alert("送出失敗："+((err&&err.message)||err)); }
});
$("soundBtn").addEventListener("click",()=>{ soundOn=!soundOn; localStorage.setItem("bt_sound",soundOn?"on":"off"); $("soundBtn").textContent=soundOn?"🔊":"🔇"; $("soundBtn").classList.toggle("off",!soundOn); if(soundOn){ ensureAudio(); playAlarm(); } });

/* tabs */
document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    const v=tab.dataset.tab;
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t===tab));
    document.querySelectorAll(".view").forEach(sec=>sec.classList.toggle("active",sec.dataset.view===v));
    window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});
  });
});
window.addEventListener("pointerdown",ensureAudio,{once:true});

/* init */
// 先用上次登入拿到的名稱填上,登入完成後會用 token claim 覆寫成最新的 Discord 暱稱
applyLockedNick(localStorage.getItem("bt_nick"));
$("soundBtn").textContent=soundOn?"🔊":"🔇"; $("soundBtn").classList.toggle("off",!soundOn);
buildPicker(); buildGrid(); buildPatrolChips(); buildRecFilter(); setCurrentBoss(currentBoss);
tick(); setInterval(tick,1000);
</script>
</body>
</html>
